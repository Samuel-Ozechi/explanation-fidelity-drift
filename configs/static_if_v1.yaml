experiment:
  name: baseline_1_static_isolation_forest
  version: v1

data:
  transactions:
    path: data/raw/ieee_cis/train_transaction.csv

target:
  column: isFraud

temporal:
  column: TransactionDT
  train_fraction: 0.60
  future_windows: 4

features:
  representation: transaction_numeric_v1

  excluded:
    - TransactionID
    - TransactionDT
    - isFraud

  max_training_missing_rate: 0.95

  remove_training_constants: true

  imputation:
    method: median
    fit_on: training_period_only

identity:
  included: false

model:
  algorithm: IsolationForest

  n_estimators: 300

  max_samples: auto

  contamination: auto

  random_state: 42

  n_jobs: -1

evaluation:
  metrics:
    - F1
    - PR-AUC

output:
  results:
    path: results/tables/static_if_v1.csv